# I2C + 1-Wire enabled — HA binary_sensor inputs on spare GPIO
#
#   cp examples/sensors-i2c-onewire.yaml config.yaml
#
# Two contact inputs plus bus-attached sensors (BME280 on I2C, DS18B20 on
# 1-Wire) published as HA sensor entities by the Linux daemon. On a Raspberry
# Pi, set device.board (e.g. pi4), enable I2C (raspi-config) and 1-Wire
# (dtoverlay=w1-gpio,gpiopin=4), and pip install smbus2.

device:
  id: sensors-01
  board: picow
  profile: sensors
  ha:
    name: "Sensor Node"

mqtt:
  host: 192.168.1.50
  port: 1883
  tls: false
  base_topic: mqttpi/sensors-01
  client_id: mqttpi-sensors-01
  homeassistant:
    discovery: true
    discovery_prefix: homeassistant
  payload_on: "ON"
  payload_off: "OFF"
  retain: true
  qos: 1

buses:
  onewire: { enabled: true, pin: 7 }
  i2c:     { enabled: true, controller: 0, sda: 0, scl: 1 }
  spi:     { enabled: false, controller: 0, sck: 2, mosi: 3, miso: 4, cs: 5 }
  i2s:     { enabled: false, bclk: 16, lrck: 17, din: 18, dout: 19 }

pwm:
  enabled: false
  pins: [8, 9, 10, 11, 12, 13, 14, 15]

mqtt_aliases: {}

pins:
  - pin: 6
    alias: enclosure_lid
    direction: input
    pull: up
    debounce_ms: 50
    ha:
      name: "Enclosure Lid"
      device_class: opening

  - pin: 20
    alias: leak_detector
    direction: input
    pull: down
    debounce_ms: 100
    ha:
      name: "Leak Detector"
      device_class: moisture

sensors:
  air:
    type: bme280              # also: bmp280, sht3x/sht31, sht4x/sht41
    bus: 1                    # /dev/i2c-1
    address: 0x76             # 0x77 with SDO high
    publish: { interval_ms: 30000 }
    # readings default to temperature (°C), humidity (%), pressure (hPa)

  probe:
    type: ds18b20
    address: 28-0316a2795f2b  # ls /sys/bus/w1/devices/ — omit with a single probe
    publish: { interval_ms: 30000 }
    readings:
      temperature:
        alias: probe_temperature
        ha: { name: "Probe Temperature" }

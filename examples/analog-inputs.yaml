# Analog inputs — HA sensor entities on GP26-GP28
#
#   cp examples/analog-inputs.yaml config.yaml
#
# Publishes normalized 0.0-1.0 (implementation may scale via ha.scale).

device:
  id: analog-01
  board: picow
  profile: maximum_gpio
  ha:
    name: "Analog Sensors"

mqtt:
  host: 192.168.1.50
  port: 1883
  tls: false
  base_topic: mqttpi/analog-01
  client_id: mqttpi-analog-01
  homeassistant:
    discovery: true
    discovery_prefix: homeassistant
  retain: true
  qos: 1

buses:
  onewire: { enabled: false, pin: 7 }
  i2c:     { enabled: false, controller: 0, sda: 0, scl: 1 }
  spi:     { enabled: false, controller: 0, sck: 2, mosi: 3, miso: 4, cs: 5 }
  i2s:     { enabled: false, bclk: 16, lrck: 17, din: 18, dout: 19 }

pwm:
  enabled: false
  pins: [8, 9, 10, 11, 12, 13, 14, 15]

mqtt_aliases: {}

pins:
  - pin: 26
    alias: sensor_a0
    direction: analog_input
    publish:
      interval_ms: 5000
    ha:
      name: "Analog A0"
      device_class: voltage
      state_class: measurement
      unit_of_measurement: "V"
      scale:
        min: 0.0
        max: 3.3

  - pin: 27
    alias: sensor_a1
    direction: analog_input
    publish:
      interval_ms: 5000
    ha:
      name: "Analog A1"
      device_class: voltage
      state_class: measurement
      unit_of_measurement: "V"
      scale:
        min: 0.0
        max: 3.3

  - pin: 28
    alias: sensor_a2
    direction: analog_input
    publish:
      interval_ms: 5000
    ha:
      name: "Analog A2"
      device_class: voltage
      state_class: measurement
      unit_of_measurement: "V"
      scale:
        min: 0.0
        max: 3.3

  # External I2C ADC (ADS1115-class) for boards without an ADC (Pi 0-5).
  # Schema only: documented ahead of its driver; entries are skipped today.
  - alias: supply_voltage
    direction: analog_input
    source: ads1115
    bus: 1
    address: 0x48             # 0x48-0x4B (ADDR pin)
    channel: 0                # A0-A3 single-ended; or "0-1" for differential
    gain: 1                   # PGA full scale: 2/3=±6.144 V, 1=±4.096 V, 2=±2.048 V, 4, 8, 16
    data_rate: 128            # samples/s
    publish:
      interval_ms: 5000
    ha:
      name: "Supply Voltage"
      device_class: voltage
      state_class: measurement
      unit_of_measurement: "V"
      scale:                  # linear map of measured volts → published value
        min: 0.0              # here: 1:4 divider, 0-3.3 V in → 0-13.2 V out
        max: 13.2
        in_min: 0.0
        in_max: 3.3

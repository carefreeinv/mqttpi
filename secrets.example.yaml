# Copy to ../secrets.yaml (repo root) before running mqttpi.
#   cp secrets.example.yaml ../secrets.yaml
#
# secrets.yaml is gitignored. Merged onto config.yaml at runtime.

mqtt:
  username: mqtt_user
  password: "change-me"  # TLS file paths may live here instead of config.yaml (see daemon.md#tls):
  # tls:
  #   ca_certs: /etc/mqttpi/ca.crt
  #   certfile: /etc/mqttpi/client.crt
  #   keyfile: /etc/mqttpi/client.key

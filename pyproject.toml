[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mqttpi"
description = "GPIO, sensors, and BMS MQTT bridge for Home Assistant on Raspberry Pi"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dynamic = ["version"]
# Keep in sync with requirements.txt (used by the clone-based install).
dependencies = [
    "pyserial>=3.5",
    "paho-mqtt>=2.0",
    "PyYAML>=6.0",
    'RPi.GPIO>=0.7; sys_platform == "linux" and platform_machine in "armv6l armv7l aarch64"',
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Home Automation",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    'amqtt>=0.11; python_version >= "3.10"',
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-awesome-pages-plugin>=2.9",
]

[project.urls]
Homepage = "https://github.com/carefreeinv/mqttpi"
Documentation = "https://carefreeinv.github.io/mqttpi/"
Changelog = "https://github.com/carefreeinv/mqttpi/blob/main/CHANGELOG.md"

[project.scripts]
mqttpi = "mqttpi.daemon:main"
mqttpi-bms = "mqttpi.bms.bridge:main"

[tool.setuptools.dynamic]
version = { attr = "mqttpi.__version__" }

[tool.setuptools.packages.find]
include = ["mqttpi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs a local MQTT broker (mosquitto or amqtt on PATH); skipped otherwise",
]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["site", "docs"]

[tool.ruff.lint]
# Minimal on purpose: real errors (pyflakes) and pycodestyle errors only.
select = ["E", "F"]

[tool.coverage.run]
source = ["mqttpi"]
